<div class="rounded-3xl border border-slate-200 bg-white p-6 shadow-sm">
  <p class="text-sm uppercase tracking-[0.24em] text-slate-500">Hotel Location</p>
  <iframe class="mt-4 h-72 w-full rounded-3xl border-0" [src]="mapUrl | safeUrl" title="Hotel map"></iframe>
  <p class="mt-4 text-sm text-slate-600">Coordinates: {{ hotel.latitude }}, {{ hotel.longitude }}</p>
</div>
