<div class="container py-4">
  <div *ngIf="loading" class="text-center py-6">
    <div class="spinner-border text-primary" role="status"></div>
  </div>

  <div *ngIf="error" class="alert alert-danger">{{ error }}</div>

  <div *ngIf="!loading && !error">
    <div class="row">
      <div class="col-md-4">
        <div class="card mb-3">
          <div class="card-body">
            <h5 class="card-title">Total Hotels</h5>
            <p class="display-6">{{ hotels.length }}</p>
            <button class="btn btn-primary btn-sm" (click)="goToSearch()">View hotels</button>
          </div>
        </div>
      </div>

      <div class="col-md-8">
        <div class="row g-3">
          <div class="col-sm-6 col-lg-3" *ngFor="let h of hotels | slice:0:4">
            <div class="card h-100">
              <img [src]="h.imageUrl" class="card-img-top" [alt]="h.name" style="height:120px;object-fit:cover">
              <div class="card-body">
                <h6 class="card-title mb-0">{{ h.name }}</h6>
                <p class="text-muted small mb-0">{{ h.location }}</p>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
