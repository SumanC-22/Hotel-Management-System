<div class="rounded-3xl border border-slate-200 bg-white p-6 shadow-sm">
  <p class="text-sm uppercase tracking-[0.24em] text-slate-500">Dashboard Overview</p>
  <div class="mt-4 grid gap-4 sm:grid-cols-2 xl:grid-cols-4">
    <div *ngFor="let item of widgets" class="rounded-3xl border border-slate-200 bg-slate-50 p-4">
      <p class="text-xs uppercase tracking-[0.24em] text-slate-500">{{ item.title }}</p>
      <p class="mt-3 text-xl font-semibold text-slate-900">{{ item.value }}</p>
    </div>
  </div>
</div>
